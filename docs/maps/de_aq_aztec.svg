<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"
     font-family="monospace" font-size="11">
  <!-- de_aq_aztec blockout sketch, top-down, 4200 x 3200 u footprint on the 64u grid -->
  <rect x="0" y="0" width="900" height="700" fill="#1b1b1b"/>
  <text x="12" y="20" fill="#e0d8b0" font-size="14">de_aq_aztec — blockout (top-down, +x right, +z down)</text>

  <defs>
    <pattern id="g3" width="12.8" height="12.8" patternUnits="userSpaceOnUse">
      <path d="M12.8 0 L0 0 0 12.8" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="90" y="40" width="538" height="410" fill="url(#g3)"/>
  <rect x="90" y="40" width="538" height="410" fill="none" stroke="#8a8060" stroke-width="2"/>
  <text x="94" y="54" fill="#8a8060">(-2112,-1600)</text>
  <text x="560" y="444" fill="#8a8060">(2112,1600)</text>

  <!-- 1 Godot unit = 0.1281 px; centre (0,0) = (359,245) -->

  <!-- canal / underpass, water at y=-64 -->
  <rect x="94" y="220" width="530" height="50" fill="#12414e" opacity="0.85"/>
  <text x="120" y="250" fill="#7fd0e0">flooded underpass — water plane y=-64 (walkable floor -64)</text>

  <!-- bridge deck at y=64, span x1152..1664 -->
  <rect x="448" y="176" width="66" height="140" fill="#3a2a1a" stroke="#c0a060"/>
  <text x="430" y="170" fill="#ffcc44">Bridge (A Site) x1152..1664 @ y=64</text>
  <circle cx="474" cy="238" r="3" fill="#ffcc44"/>

  <!-- temple (B site) with 4 columns -->
  <rect x="196" y="315" width="100" height="106" fill="#241f18" stroke="#ff8844"/>
  <rect x="222" y="330" width="10" height="10" fill="#ccc"/>
  <rect x="264" y="330" width="10" height="10" fill="#ccc"/>
  <rect x="222" y="392" width="10" height="10" fill="#ccc"/>
  <rect x="264" y="392" width="10" height="10" fill="#ccc"/>
  <circle cx="240" cy="372" r="3" fill="#ff8844"/>
  <text x="150" y="436" fill="#ff8844">Temple (B Site, -1100,800) + 4 columns</text>

  <!-- snipers' nest -->
  <rect x="540" y="212" width="34" height="82" fill="#333" stroke="#66ccee"/>
  <text x="536" y="206" fill="#66ccee">Nest (1700,128,0)</text>

  <!-- spawns -->
  <circle cx="130" cy="78" r="5" fill="#ff5555"/>
  <text x="66" y="70" fill="#ff5555">T Spawn (-1900,-1400)</text>
  <circle cx="586" cy="412" r="5" fill="#5588ff"/>
  <text x="496" y="430" fill="#5588ff">CT Spawn (1900,1400)</text>

  <!-- routes -->
  <path d="M160 110 L230 150 L320 200 L420 230 L474 238" stroke="#c0a060" stroke-width="2" fill="none"/>
  <text x="300" y="192" fill="#c0a060">T → bridge approach</text>

  <path d="M474 268 L474 300 L420 300 L350 300 L300 320 L240 350" stroke="#70a070" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  <text x="330" y="316" fill="#70a070">underpass → temple</text>

  <path d="M130 140 L110 220 L150 300 L210 330" stroke="#888" stroke-width="2" fill="none"/>
  <text x="104" y="270" fill="#888">west lane</text>

  <path d="M586 380 L560 300 L560 240" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  <text x="566" y="322" fill="#888">CT → nest (ramps 128 → 64)</text>

  <!-- bridge downramp -->
  <rect x="498" y="176" width="18" height="18" fill="#5a4028" stroke="#c0a060"/>
  <text x="520" y="190" fill="#c0a060">down-ramp +64 → -64</text>

  <text x="12" y="500" fill="#9c9c9c">key coords: A Site (1408,64,-832) · B Site (-1088,0,992) · water y=-64</text>
  <text x="12" y="516" fill="#9c9c9c">Snipers' Nest (1696,128,0) overlooking the bridge approach</text>
  <text x="12" y="532" fill="#9c9c9c">spawns: T1-T4 around (-1920,0,-1440) · CT1-CT4 around (1856,0,1344)</text>
  <text x="12" y="548" fill="#9c9c9c">cover: 30 crates (64u, 1-3 tall) deterministic from seed 0xA27EC</text>
  <text x="12" y="572" fill="#6f6f6f">blockout only — geometry built by scripts/maps/de_aq_aztec.gd; 64u grid, snapped</text>
  <text x="12" y="588" fill="#6f6f6f">materials: stone / wood bridge / water / foliage + 3 trim (7 &lt;= 8)</text>
  <text x="12" y="604" fill="#6f6f6f">water = the single TRANSPARENCY_ALPHA material (brief-mandated); nothing else alpha-blends</text>
</svg>
