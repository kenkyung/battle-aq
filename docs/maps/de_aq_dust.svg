<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"
     font-family="monospace" font-size="11">
  <!-- de_aq_dust blockout sketch, top-down, 4500 x 3500 u footprint on the 64u grid -->
  <rect x="0" y="0" width="900" height="700" fill="#1b1b1b"/>
  <text x="12" y="20" fill="#e0d8b0" font-size="14">de_aq_dust — blockout (top-down, +x right, +z down)</text>

  <!-- 64u grid -->
  <defs>
    <pattern id="g" width="12.8" height="12.8" patternUnits="userSpaceOnUse">
      <path d="M12.8 0 L0 0 0 12.8" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="100" y="40" width="640" height="512" fill="url(#g)"/>
  <rect x="100" y="40" width="640" height="512" fill="none" stroke="#8a8060" stroke-width="2"/>
  <text x="104" y="54" fill="#8a8060">(-2304,-1792)</text>
  <text x="660" y="546" fill="#8a8060">(2304,1792)</text>

  <!-- 1 Godot unit = 0.1422 px; centre of the footprint (0,0) = (420,296) -->

  <!-- mid door chokepoint at (0,0), 128u wide -->
  <rect x="418" y="286" width="14" height="9" fill="#c8c8c8"/>
  <text x="440" y="291" fill="#c8c8c8">mid door (128u)</text>

  <!-- bombsites -->
  <rect x="340" y="110" width="90" height="90" fill="none" stroke="#ffcc44" stroke-dasharray="4 3"/>
  <circle cx="364" cy="135" r="3" fill="#ffcc44"/>
  <text x="342" y="106" fill="#ffcc44">A Site (y=64 platform)</text>

  <rect x="175" y="245" width="100" height="100" fill="none" stroke="#ff8844" stroke-dasharray="4 3"/>
  <circle cx="245" cy="298" r="3" fill="#ff8844"/>
  <text x="177" y="361" fill="#ff8844">B Site (y=-64 pit)</text>

  <!-- spawns -->
  <circle cx="130" cy="98" r="5" fill="#ff5555"/>
  <text x="106" y="90" fill="#ff5555">T Spawn (-2200,-1500)</text>
  <circle cx="700" cy="494" r="5" fill="#5588ff"/>
  <text x="600" y="510" fill="#5588ff">CT Spawn (2200,1500)</text>

  <!-- lanes -->
  <path d="M140 120 L180 200 L160 250 L180 340 L150 420" stroke="#a08050" stroke-width="2" fill="none"/>
  <text x="112" y="440" fill="#a08050">T → B (banana)</text>

  <path d="M150 470 L200 430 L260 420 L330 424 L420 470 L520 480 L610 470 L680 440" stroke="#a08050" stroke-width="2" fill="none"/>
  <text x="300" y="500" fill="#a08050">Long A</text>

  <path d="M150 130 L260 150 L380 170 L470 180 L600 150 L680 130" stroke="#70a070" stroke-width="2" fill="none"/>
  <text x="480" y="128" fill="#70a070">Short A / catwalk</text>

  <path d="M240 300 L330 300 L418 292 L436 292 L520 300 L610 310 L680 340" stroke="#888" stroke-width="2" fill="none"/>
  <text x="470" y="320" fill="#888">Mid</text>

  <path d="M680 460 L650 400 L600 350 L520 320" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <text x="620" y="392" fill="#888">CT → A</text>

  <!-- key coords -->
  <text x="12" y="580" fill="#9c9c9c">key coords: T Ramp (-2200,0,800) · T Spawn (-2200,0,-1500)</text>
  <text x="12" y="596" fill="#9c9c9c">A Site (1900,0,-1100) y=64 · B Site (-1100,0,1100) y=-64 · CT (2200,0,1500)</text>
  <text x="12" y="612" fill="#9c9c9c">spawns: T1-T4 around (-2176,0,-1472) · CT1-CT4 around (2112,0,1408)</text>
  <text x="12" y="628" fill="#9c9c9c">cover: 30 crates (64u, 1-3 tall) deterministic from seed 0xD057</text>
  <text x="12" y="648" fill="#6f6f6f">blockout only — geometry built by scripts/maps/de_aq_dust.gd; 64u grid, snapped</text>
  <text x="12" y="664" fill="#6f6f6f">materials: sand floor / adobe walls / wood crates / metal grates + 3 trim (7 &lt;= 8)</text>
</svg>
